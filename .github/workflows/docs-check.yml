name: docs-check

on:
  push:
    branches: [master, dev, "plan/**", "feat/**", "results/**"]
  pull_request:
    branches: [master, dev]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Whitespace
        run: git diff --check HEAD^ HEAD || true
      - name: Repository checks
        run: python scripts/check_repo.py
